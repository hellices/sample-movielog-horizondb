spring.application.name=spring-sample
spring.config.import=optional:file:.env[.properties]

# Database: PostgreSQL, values come from the environment (see .env.sample)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/springsample}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:springsample}
# .env is imported as a properties file, so its keys are not relaxed-bound like OS environment variables.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Web and error handling
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Metrics (see docs/monitoring.md). /actuator/prometheus is limited to app.metrics.scrape-allowed-ips.
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
app.metrics.scrape-allowed-ips=${METRICS_SCRAPE_ALLOWED_IPS:127.0.0.1,::1}

# Logging
logging.level.root=INFO
logging.level.com.example.springsample=INFO

# OpenAPI / Swagger UI: off by default, enabled in the dev profile
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.csrf.enabled=true

# Movie data: TMDB (search, posters) + OMDb (Rotten Tomatoes, IMDb, Metacritic scores).
# Keys come from the environment or .env; a blank key disables that source.
app.movies.tmdb.api-key=${TMDB_API_KEY:}
app.movies.tmdb.language=ko-KR
app.movies.omdb.api-key=${OMDB_API_KEY:}
app.movies.sync-ttl=7d
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=5s

# Discover: query embeddings with Azure OpenAI (Entra ID token, no key). Blank endpoint disables semantic search.
app.discover.embedding.endpoint=${AZURE_OPENAI_ENDPOINT:}
app.discover.embedding.deployment=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:text-embedding-3-large}
app.discover.embedding.dimensions=1536
app.discover.embedding.api-version=2024-10-21
# Korean BGE-M3 (dragonkue/BGE-m3-ko, 1,024 dimensions) on an OpenAI-compatible embeddings server (vLLM in the
# sample), stored in embedding_bge. Blank URL disables the bge model, e.g. http://embeddings.movielog.svc.cluster.local.
app.discover.embedding.bge-url=${EMBEDDINGS_BGE_URL:}
# Served model name sent as "model"; vLLM rejects any other name.
app.discover.embedding.bge-model=${EMBEDDINGS_BGE_MODEL:dragonkue/BGE-m3-ko}
# Model of searches that name none (openai or bge). Blank: bge when bge-url is set, otherwise openai.
app.discover.embedding.default-model=${EMBEDDING_DEFAULT_MODEL:}
# Semantic search is anonymous and calls an embedding model: cap it per client address and in total, per Pod and minute.
app.discover.rate-limit.per-client-per-minute=${DISCOVER_RATE_LIMIT_PER_CLIENT:30}
app.discover.rate-limit.total-per-minute=${DISCOVER_RATE_LIMIT_TOTAL:300}
